name: Apply approved data retention

on:
  schedule:
    - cron: "45 10 * * *"
  workflow_dispatch:

concurrency:
  group: givehub-data-retention
  cancel-in-progress: false

jobs:
  retention:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.GIVEHUB_DATABASE_URL }}
      RETENTION_DAYS: ${{ vars.GIVEHUB_RETENTION_DAYS }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        if: env.DATABASE_URL != '' && env.RETENTION_DAYS != ''
        with:
          python-version: "3.13"
      - name: Remove expired personal application data
        if: env.DATABASE_URL != '' && env.RETENTION_DAYS != ''
        working-directory: apps/api
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python -m givehub.lifecycle --days "$RETENTION_DAYS" --apply >> "$GITHUB_STEP_SUMMARY"
      - name: Explain unconfigured retention
        if: env.DATABASE_URL == '' || env.RETENTION_DAYS == ''
        run: echo "Set GIVEHUB_DATABASE_URL and the team's approved GIVEHUB_RETENTION_DAYS before enabling deletion." >> "$GITHUB_STEP_SUMMARY"
