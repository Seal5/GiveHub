name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run mypy givehub
      - run: uv run pytest --cov=givehub --cov-report=term-missing
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./migration-check.db
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: pnpm
      - name: Verify generated OpenAPI client
        working-directory: ${{ github.workspace }}
        run: |
          pnpm install --frozen-lockfile
          uv run --project apps/api python apps/api/scripts/export_openapi.py > "$RUNNER_TEMP/givehub-openapi.json"
          pnpm --dir apps/mobile exec openapi-ts -i "$RUNNER_TEMP/givehub-openapi.json" -o src/lib/generated
          git diff --exit-code -- apps/mobile/src/lib/generated
      - run: docker build -f Dockerfile -t givehub-api ../..

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @givehub/mobile typecheck
      - run: pnpm --filter @givehub/mobile test
