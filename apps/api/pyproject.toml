[project]
name = "givehub-api"
version = "0.1.0"
description = "GiveHub volunteer coordination API"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "beautifulsoup4>=4.12,<5",
  "fastapi[standard]>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy>=2.0.41,<3"
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["givehub*"]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "UP042", "UP043"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
