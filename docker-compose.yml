services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: givehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - givehub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d givehub"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/givehub
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["fastapi", "run", "givehub/main.py", "--host", "0.0.0.0", "--port", "8000"]
volumes:
  givehub-postgres:
